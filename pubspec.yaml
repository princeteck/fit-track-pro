name: fittrack_pro
description: "FitTrack Pro is a modern, offline-capable health and fitness tracker built using Flutter. It helps users monitor and log their daily fitness journey securely with features like onboarding walkthroughs, secure authentication, local data storage, and more."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.8
  go_router: ^16.0.0
  flutter_bloc: ^9.1.1
  freezed: ^3.2.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  get_it: ^8.0.3
  injector: ^4.0.0
  google_fonts: ^6.2.1
  dartz: ^0.10.1
  flutter_secure_storage: ^5.1.2
  flutter_svg: ^2.2.0
  animations: ^2.0.11
  smooth_page_indicator: ^1.2.1
  flutter_local_notifications: ^19.3.1
  flutter_app_launcher_icon: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.6.0
  json_serializable: ^6.10.0

flutter:
  uses-material-design: true
