name: fittrack_pro
description: "Fit Track Pro is a modern, offline-capable health and fitness tracker built using Flutter. It helps users monitor and log their daily fitness journey securely with features like onboarding walkthroughs, secure authentication, local data storage, and more."
publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^16.0.0
  flutter_bloc: ^9.1.1
  freezed: ^2.4.6
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  get_it: ^8.0.3
  google_fonts: ^6.2.1
  dartz: ^0.10.1
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.2.0
  animations: ^2.0.11
  smooth_page_indicator: ^1.2.1
  flutter_local_notifications: ^19.3.1
  flutter_launcher_icons: ^0.14.4
  uih: ^1.0.5
  intl: ^0.20.2
  injectable: ^2.5.0
  injectable_generator: ^2.7.0
  sqflite: ^2.4.1
  path: ^1.9.1
  crypto: ^3.0.5
  package_info_plus: ^8.1.3
  figma_squircle: ^0.6.3
  mrx_charts: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logos/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logos/logo.png"
  remove_alpha_ios: true
  android_app_name: "Fit Track Pro"
  ios_app_name: "Fit Track Pro"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - "assets/images/logos/"
    - "assets/icons/"
    - "assets/images/walkthrough/"


